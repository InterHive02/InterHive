apiVersion: v1
kind: ConfigMap
metadata:
  name: interhive-config
  namespace: interhive
data:
  redis-host: "interhive-redis"
  redis-port: "6379"
  app-url: "https://interhive.in"
  api-url: "https://api.interhive.in"
  log-level: "info"
  cors-origin: "https://interhive.in,https://www.interhive.in"
---
apiVersion: v1
kind: Secret
metadata:
  name: interhive-secrets
  namespace: interhive
type: Opaque
data:
  # These should be base64 encoded
  mongodb-uri: ""
  mongodb-username: ""
  mongodb-password: ""
  jwt-secret: ""
  jwt-refresh-secret: ""
  smtp-user: ""
  smtp-password: ""
  smtp-host: ""