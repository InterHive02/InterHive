apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interhive-ingress
  namespace: interhive
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "interhive-backend"
spec:
  tls:
    - hosts:
        - interhive.in
        - www.interhive.in
        - api.interhive.in
      secretName: interhive-tls
  rules:
    - host: interhive.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: interhive-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: interhive-backend
                port:
                  number: 3000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: interhive-backend
                port:
                  number: 3000
    - host: www.interhive.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: interhive-frontend
                port:
                  number: 80
    - host: api.interhive.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: interhive-backend
                port:
                  number: 3000