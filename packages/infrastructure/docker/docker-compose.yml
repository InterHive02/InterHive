version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: interhive-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: interhive
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - interhive-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: interhive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - interhive-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: packages/backend/Dockerfile
    container_name: interhive-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/interhive?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../packages/backend/src:/app/packages/backend/src
      - ../../packages/shared/src:/app/packages/shared/src
    networks:
      - interhive-network
    command: yarn start:dev

  frontend:
    build:
      context: ../..
      dockerfile: packages/frontend/Dockerfile
    container_name: interhive-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - interhive-network
    environment:
      - VITE_API_BASE_URL=http://localhost:3000

networks:
  interhive-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  redis_data: